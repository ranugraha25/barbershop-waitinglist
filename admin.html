<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

<div class="max-w-4xl mx-auto space-y-4">

  <div class="bg-white p-5 rounded-2xl shadow">
    <h1 class="text-xl font-bold mb-4 text-center">Admin Panel</h1>

    <div class="flex gap-2 mb-4 flex-wrap">
      <button onclick="resetQueue()" class="bg-red-500 text-white px-3 py-2 rounded">Reset Antrian</button>
      <button onclick="exportCSV()" class="bg-blue-500 text-white px-3 py-2 rounded">Export CSV</button>
    </div>

    <ul id="list" class="space-y-2"></ul>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  updateDoc,
  doc,
  query,
  orderBy,
  getDocs,
  deleteDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHpfYfIn2_kVK7lvtluA6HA9XXnrXlMI4",
  authDomain: "barbershop-waiting-list.firebaseapp.com",
  projectId: "barbershop-waiting-list",
  storageBucket: "barbershop-waiting-list.firebasestorage.app",
  messagingSenderId: "301778921791",
  appId: "1:301778921791:web:1c7d95adacc1a767ec0b8a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const queueRef = collection(db, "queue");
const counterRef = doc(db, "counter", "queue");

function getColor(status) {
  if (status === 'waiting') return 'bg-yellow-200';
  if (status === 'in progress') return 'bg-blue-200';
  if (status === 'done') return 'bg-green-200';
  if (status === 'canceled') return 'bg-red-200';
  return 'bg-gray-200';
}

// REALTIME LIST
onSnapshot(query(queueRef, orderBy("number")), (snapshot) => {
  const list = document.getElementById("list");
  list.innerHTML = "";

  snapshot.forEach(d => {
    const q = d.data();
    const id = d.id;

    const li = document.createElement("li");
    li.className = `p-3 rounded ${getColor(q.status)}`;

    li.innerHTML = `
      <div class="flex flex-col gap-2">
        <div>
          <b>#${q.number}</b> - ${q.name}<br>
          <small>${q.phone}</small><br>
          <small>Status: ${q.status}</small>
        </div>

        <div class="flex flex-wrap gap-2">
          <button onclick="setProgress('${id}')" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">Progress</button>
          <button onclick="setStatus('${id}','done')" class="bg-green-500 text-white px-2 py-1 rounded text-xs">Done</button>
          <button onclick="setStatus('${id}','canceled')" class="bg-red-500 text-white px-2 py-1 rounded text-xs">Cancel</button>
          <button onclick="wa('${q.phone}',${q.number})" class="bg-green-700 text-white px-2 py-1 rounded text-xs">WA</button>
        </div>
      </div>
    `;

    list.appendChild(li);
  });
});

// PROGRESS (MAX 3)
window.setProgress = async function (id) {
  const snapshot = await getDocs(queueRef);
  const count = snapshot.docs.filter(d => d.data().status === 'in progress').length;

  if (count >= 3) return alert("Max 3 antrian progress");

  await updateDoc(doc(db, "queue", id), {
    status: "in progress"
  });
};

window.setStatus = async function (id, status) {
  await updateDoc(doc(db, "queue", id), { status });
};

// RESET
window.resetQueue = async function () {
  if (!confirm("Yakin reset semua antrian?")) return;

  const snapshot = await getDocs(queueRef);

  for (const d of snapshot.docs) {
    await deleteDoc(doc(db, "queue", d.id));
  }

  await setDoc(counterRef, {
    lastNumber: 0
  });

  alert("Reset berhasil");
};

// EXPORT CSV
window.exportCSV = async function () {
  const snapshot = await getDocs(query(queueRef, orderBy("number")));

  let csv = "Nomor,Nama,Phone,Status\n";

  snapshot.forEach(d => {
    const q = d.data();
    csv += `${q.number},${q.name},${q.phone},${q.status}\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'antrian.csv';
  a.click();
};

// WA
window.wa = function (phone, num) {
  const msg = `Antrian #${num} sudah dipanggil, 5 menit akan di skip`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);
};
</script>

</body>
</html>
